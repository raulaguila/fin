# Dedicated Air profile for the backend API.
# Run with: air -c air.backend.toml

#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp/dev-backend"
env_files = ["config/.env"]

[build]
pre_cmd = ["mkdir -p ./tmp/dev-backend/bin ./tmp/dev-backend/gocache ./tmp/dev-backend/gotmp"]
cmd = "GOCACHE=$(pwd)/tmp/dev-backend/gocache GOTMPDIR=$(pwd)/tmp/dev-backend/gotmp go build -o ./tmp/dev-backend/bin/backend ./cmd/backend/main.go"
entrypoint = ["./tmp/dev-backend/bin/backend"]

include_dir = ["cmd/backend", "config", "internal", "pkg", "build/db/migrations"]
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "sql", "toml"]
include_file = ["go.mod", "go.sum", "air.toml", "air.backend.toml", "config/.env"]

exclude_dir = ["tmp", "bin", "docs", "build/docker", "api"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true

delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"
log = "air.backend.log"

[log]
time = true

[misc]
clean_on_exit = true
