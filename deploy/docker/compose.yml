name: authenticity

include:
  - services.compose.yml

services:

  # migrate:

  #   container_name: authenticity_migrate
  #   image: migrate/migrate:v4.18.3
  #   restart: "no"
  #   volumes:
  #     - ../db/migrations:/migrations:ro
  #   command: >
