# Web stack. Joins the backend network, so start the backend stack first
# (make compose-build in backend/).
name: fin_web

services:

  web:

    container_name: fin_web
    image: fin_web:${WEB_VERSION:-dev}
    hostname: web
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        - NEXT_PUBLIC_PLUGGY_CONNECTORS=${NEXT_PUBLIC_PLUGGY_CONNECTORS:-}
    restart: always
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      # Plain HTTP only on this machine; other devices use HTTPS through the proxy below.
      - 127.0.0.1:${WEB_PORT:-3016}:3005
    env_file: ../config/.env
    environment:
      - API_URL=http://backend:${API_PORT:-9979}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in frontend/config/.env (make init)}
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      fin_network:
        # The backend trusts X-Real-IP only from this address (its WEB_IP).
        ipv4_address: ${WEB_IP:-172.30.98.10}

  proxy:

    container_name: fin_proxy
    image: caddy:2.10.0-alpine
    restart: always
    depends_on:
      - web
    ports:
      - ${WEB_HTTPS_PORT:-3443}:443
    environment:
      - WEB_HOSTS=${WEB_HOSTS:-localhost}
      - WEB_SNI=${WEB_SNI:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The local CA and its certificates: kept, so devices trust it once.
      - proxy_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - fin_network

volumes:

  proxy_data:
    name: fin_proxy_data

networks:

  fin_network:
    name: fin_network
    external: true
