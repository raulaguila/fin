name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: authenticity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Swagger docs match the annotations
        run: make swagger && git diff --exit-code internal/adapter/inbound/http/rest/docs
      - run: go test -race ./...
        env:
          TEST_POSTGRES_URL: postgres://postgres:test@localhost:5432/authenticity_test?sslmode=disable
