name: fin

include:
  - services.compose.yml

services:

  # The backend runs as nobody; a fresh named volume is owned by root. This
  # one-shot step hands the uploads directory to nobody before the backend starts.
  files-init:

    container_name: fin_files_init
    image: fin_backend:${SYS_VERSION}
    user: "0:0"
    entrypoint: ["chown", "65534:65534", "/data/files"]
    restart: "no"
    volumes:
      - files_volume:/data/files

  backend:

    container_name: fin_backend
    image: fin_backend:${SYS_VERSION}
    hostname: backend
    build:
      context: ../..
      dockerfile: deploy/docker/backend/${BASE:-source}.Dockerfile
    restart: always
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${API_PORT}/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      # Loopback only: the web app reaches the API on the Docker network; the LAN goes through the web app.
      - 127.0.0.1:${API_PORT}:${API_PORT}
    tty: true
    extra_hosts:
      - host.docker.internal:host-gateway  # reach a host Ollama (AI_OPENAI_URL)
    env_file: ../../config/.env
    environment:
      - TZ=${TZ}
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_APP_USER:-${POSTGRES_USER}}
      - POSTGRES_PASS=${POSTGRES_APP_PASS:-${POSTGRES_PASS}}
      - POSTGRES_APP_PASS= # already in POSTGRES_PASS above
      - POSTGRES_MAILER_PASS= # do not inherit the mailer credential from env_file
      - GOMEMLIMIT=400MiB  # GC pressure before the container limit
      # Only the web BFF (frontend/deploy/compose.yml) may set the client IP; the gateway may not.
      - API_TRUSTED_PROXIES=${WEB_IP:-172.30.98.10}
      - STORAGE_LOCAL_DIR=/data/files  # used when STORAGE_DRIVER is local
    volumes:
      - files_volume:/data/files
    deploy:
      resources:
        limits:
          memory: 1G  # 4 Argon2 hashes at 64 MiB + buffers, plus one claude -p process
    networks:
      - fin_network
    depends_on:
      postgres:
        condition: service_healthy
      files-init:
        condition: service_completed_successfully

  mailer:

    container_name: fin_mailer
    image: fin_mailer:${SYS_VERSION}
    hostname: mailer
    build:
      context: ../..
      dockerfile: deploy/docker/mailer/${BASE:-source}.Dockerfile
    restart: always
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9091/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    tty: true
    env_file: ../../config/.env
    environment:
      - TZ=${TZ}
      - SYS_SERVICE=mailer
      - ACCESS_TOKEN=new  # replaces the real signing keys: this process issues no token
      - REFRESH_TOKEN=new
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_MAILER_USER:-fin_mailer}
      - POSTGRES_PASS=${POSTGRES_MAILER_PASS:?Set POSTGRES_MAILER_PASS and run make migrate-up}
      - POSTGRES_APP_PASS= # do not inherit the backend credential from env_file
      - POSTGRES_URL=host=postgres user=${POSTGRES_MAILER_USER:-fin_mailer} password=${POSTGRES_MAILER_PASS:?Set POSTGRES_MAILER_PASS} dbname=${POSTGRES_BASE} port=${POSTGRES_PORT} sslmode=disable
      - POSTGRES_MAX_CONNS=5  # sends one email at a time
      - GOMEMLIMIT=100MiB
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - fin_network
    depends_on:
      postgres:
        condition: service_healthy

  # Daily dump, optional encrypted copy to another place and a weekly restore
  # test: deploy/docker/postgres/backup.sh. Restore: see README ("Backup").
  backup:

    container_name: fin_backup
    image: fin_postgres
    restart: always
    entrypoint: ["/usr/local/bin/fin-backup"]
    environment:
      - TZ=${TZ}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_BASE=${POSTGRES_BASE}
      - PGPASSWORD=${POSTGRES_PASS}
      - BACKUP_COPY_DIR=${BACKUP_COPY_DIR:-}
      - BACKUP_PASSPHRASE=${BACKUP_PASSPHRASE:-}
    volumes:
      - ${BACKUP_DIR:-../../backups}:/backups
      # Without BACKUP_COPY_DIR this mounts the dumps again and the script copies nothing.
      - ${BACKUP_COPY_DIR:-../../backups}:/copy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - fin_network
    depends_on:
      postgres:
        condition: service_healthy
