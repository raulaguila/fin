name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: authenticity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Swagger docs match the annotations
        run: make swagger && git diff --exit-code internal/adapter/inbound/http/rest/docs
      - run: go test -race ./...
        env:
          TEST_POSTGRES_URL: postgres://postgres:test@localhost:5432/authenticity_test?sslmode=disable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager in frontend/package.json
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  # Real browser against a real backend: the BFF and the screens, which the Go tests never reach.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: authenticity_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 15
    env:
      # Test-only backend settings, see frontend/e2e/README.md. Never production values.
      SYS_ENVIRONMENT: development
      TZ: UTC
      API_PORT: 9990
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASS: test
      POSTGRES_BASE: authenticity_e2e
      AUTH_MANUAL_TOKEN_DELIVERY: 1
      AUTH_EMAIL_TOKEN_COOLDOWN: 1s
      API_RATE_LIMIT_AUTH: 100
      E2E_ADMIN_EMAIL: admin@example.test
      E2E_ADMIN_PASSWORD: Correct horse battery 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Start the backend with an admin
        working-directory: backend
        run: |
          go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3 -path deploy/db/migrations \
            -database "postgres://postgres:test@localhost:5432/authenticity_e2e?sslmode=disable" up
          go build -o "$RUNNER_TEMP/backend" ./cmd/backend
          go build -o "$RUNNER_TEMP/admin" ./cmd/admin
          export SMTP_MASTER_KEY="$(openssl rand -hex 32)"
          printf '%s\n' 'E2E Admin' "$E2E_ADMIN_EMAIL" "$E2E_ADMIN_PASSWORD" "$E2E_ADMIN_PASSWORD" | "$RUNNER_TEMP/admin" bootstrap
          nohup "$RUNNER_TEMP/backend" > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:9990/health > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/backend.log"; exit 1
      - name: Run Playwright
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Backend log
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"
