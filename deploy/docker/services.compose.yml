name: authenticity

volumes:

  postgres_volume:
    name: authenticity_pg_volume

networks:

  authenticity_network:
    name: authenticity_network
    driver: bridge

services:

  postgres:

    container_name: authenticity_postgres
    image: authenticity_postgres
    hostname: postgres
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: always
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    command: >
      postgres
      -p ${POSTGRES_PORT}
      -c shared_preload_libraries='pg_cron'
      -c cron.database_name='${POSTGRES_BASE}'
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=${POSTGRES_BASE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASS}
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_BASE} -p ${POSTGRES_PORT}'" ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 1s
      start_interval: 2s
    networks:
      - authenticity_network

