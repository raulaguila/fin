  #     postgres:
  #       condition: service_healthy

  backend:

    container_name: authenticity_backend
    image: authenticity_backend:${SYS_VERSION}
    hostname: backend
    build:
      context: ../..
      dockerfile: deploy/docker/backend/${BASE:-source}.Dockerfile
    restart: always
    ports:
      - ${API_PORT}:${API_PORT}
    tty: true
    env_file: ../../config/.env
    environment:
      - TZ=${TZ}
      - POSTGRES_HOST=postgres
      - GOMEMLIMIT=400MiB  # GC pressure before the container limit
    deploy:
      resources:
        limits:
          memory: 512M  # 4 Argon2 hashes at 64 MiB + buffers
    networks:
      - authenticity_network
    depends_on:
      # migrate:
      #   condition: service_completed_successfully
      postgres:
        condition: service_healthy

  mailer:

    container_name: authenticity_mailer
    image: authenticity_mailer:${SYS_VERSION}
    hostname: mailer
    build:
      context: ../..
      dockerfile: deploy/docker/mailer/${BASE:-source}.Dockerfile
    restart: always
    tty: true
    env_file: ../../config/.env
    environment:
      - TZ=${TZ}
      - POSTGRES_HOST=postgres
      - POSTGRES_MAX_CONNS=5  # sends one email at a time
      - GOMEMLIMIT=100MiB
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - authenticity_network
    depends_on:
      postgres:
        condition: service_healthy
    #   migrate:
    #     condition: service_completed_successfully
